# A release is a tag on main: `git tag v0.1.0 && git push origin v0.1.0`.
#
# It builds the `rustc4` command for each platform below, attests where each
# archive was built (so `gh attestation verify` can tell a download from
# this workflow from one that is not), and publishes them as a GitHub
# release. The two Linux builds also go, as one image for both
# architectures, to ghcr.io/<owner>/rustc4 (tools/docker/Dockerfile), under
# the version and, unless it is a pre-release, `latest`. Only the CLI is
# released: the macOS app is not.
#
# Run by hand (workflow_dispatch), or by a pull request that changes this
# file or the image's, it builds and keeps the archives and the images as
# workflow artifacts, and publishes nothing: a rehearsal.
name: Release

on:
  push:
    tags: ["v*"]
  pull_request:
    paths: [".github/workflows/release.yml", "tools/docker/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: tag is on main
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # A tag can be pushed from any branch, or from none. Only what has
      # been merged is released.
      - name: The tag names a version, and its commit is on main
        if: github.ref_type == 'tag'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::'$TAG' is not a version: tag releases like v1.2.3 or v1.2.3-rc.1"
            exit 1
          fi
          git fetch --no-tags origin main
          commit=$(git rev-parse "refs/tags/$TAG^{commit}")
          if ! git merge-base --is-ancestor "$commit" origin/main; then
            echo "::error::$TAG is at $commit, which is not on main. Merge it first, then tag the commit on main."
            exit 1
          fi

      - name: Version
        id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$REF_TYPE" = tag ]; then
            echo "version=$REF_NAME" >> "$GITHUB_OUTPUT"
          else
            echo "version=rehearsal-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: build ${{ matrix.target }}
    needs: check
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: linux-x86_64
            runner: ubuntu-latest
            bazelisk: bazelisk-linux-amd64
            bazelisk_sha256: a248ae2b2b62b5baebb748f6fba7203bff1a27e5d01b55399a8406744cb539e8
          - target: linux-aarch64
            runner: ubuntu-24.04-arm
            bazelisk: bazelisk-linux-arm64
            bazelisk_sha256: b2bcc040c213b44586b121bda6d983c35df121b917c3a7a66fb16f2fa0df1a4f
          - target: macos-arm64
            runner: macos-latest
            bazelisk: bazelisk-darwin-arm64
            bazelisk_sha256: 555d2ff912ccd336d0060bdb5251ef2f62629c6f8fbadb59005a45d5625793ec
          # Windows is built on Linux: everything on the way to the binary
          # (the viewer's wasm and JavaScript among it) is made by Linux
          # tools, and only the last compile and link are for Windows. It
          # cannot be run here, so the `windows` job below does that.
          - target: windows-x86_64
            runner: ubuntu-latest
            bazelisk: bazelisk-linux-amd64
            bazelisk_sha256: a248ae2b2b62b5baebb748f6fba7203bff1a27e5d01b55399a8406744cb539e8
            platform: //bazel:windows_x86_64
    runs-on: ${{ matrix.runner }}
    # Nothing is cached between releases, so each builds the toolchain
    # (on Linux: glibc, libc++, compiler-rt and libunwind) from source.
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Most runners have Bazelisk as `bazel`. Where one does not, this
      # exact build of it is fetched, and checked before it is run.
      - name: Bazel
        env:
          BAZELISK: ${{ matrix.bazelisk }}
          BAZELISK_SHA256: ${{ matrix.bazelisk_sha256 }}
        run: |
          if ! command -v bazel >/dev/null; then
            mkdir -p "$RUNNER_TEMP/bin"
            curl --fail --silent --show-error --location \
              "https://github.com/bazelbuild/bazelisk/releases/download/v1.30.0/$BAZELISK" \
              --output "$RUNNER_TEMP/bin/bazel"
            echo "$BAZELISK_SHA256  $RUNNER_TEMP/bin/bazel" | shasum -a 256 --check
            chmod +x "$RUNNER_TEMP/bin/bazel"
            echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
            export PATH="$RUNNER_TEMP/bin:$PATH"
          fi
          bazel --version

      - name: Build the CLI
        env:
          PLATFORM: ${{ matrix.platform }}
        run: bazel build --config=release ${PLATFORM:+--platforms="$PLATFORM"} //cli

      # The binary that is about to be published, not another build of it.
      - name: It runs
        if: ${{ !matrix.platform }}
        run: |
          bazel-bin/cli/cli --help
          bazel-bin/cli/cli check examples/shop.c4

      - name: Archive
        env:
          VERSION: ${{ needs.check.outputs.version }}
          TARGET: ${{ matrix.target }}
        run: |
          name="rustc4-$VERSION-$TARGET"
          mkdir -p "dist/$name"
          cp LICENSE README.md "dist/$name/"
          case "$TARGET" in
            windows-*)
              cp bazel-bin/cli/cli.exe "dist/$name/rustc4.exe"
              (cd dist && zip -qr "$name.zip" "$name")
              ;;
            *)
              cp bazel-bin/cli/cli "dist/$name/rustc4"
              tar -C dist -czf "dist/$name.tar.gz" "$name"
              ;;
          esac
          rm -r "dist/$name"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rustc4-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error
          retention-days: 7

  # The Windows archive, as a user gets it: unpacked and run on Windows.
  # Nothing is built here.
  windows:
    name: run windows-x86_64
    needs: build
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rustc4-windows-x86_64
          path: dist

      - name: It runs
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Expand-Archive -Path (Get-Item dist/rustc4-*.zip) -DestinationPath unpacked
          $rustc4 = (Get-Item unpacked/rustc4-*/rustc4.exe).FullName
          & $rustc4 --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $rustc4 check examples/shop.c4
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $rustc4 export png examples/shop.c4 -o out
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $rustc4 build examples\delivery -o site
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem out, site

  # The image, from the Linux archive as a user gets it, and run as a user
  # runs it: each architecture on a runner of its own kind. What is tested
  # here is saved, and is what `publish` pushes.
  image:
    name: image linux-${{ matrix.arch }}
    needs: [check, build]
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            target: linux-x86_64
            runner: ubuntu-latest
          - arch: arm64
            target: linux-aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    env:
      IMAGE: rustc4:${{ matrix.arch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rustc4-${{ matrix.target }}
          path: dist

      # --provenance=false: one plain image, not an index of an image and
      # a note about it, so `publish` can put the two under one name. Where
      # it was built is attested there.
      - name: Build the image
        env:
          VERSION: ${{ needs.check.outputs.version }}
          ARCH: ${{ matrix.arch }}
        run: |
          mkdir -p "context/linux-$ARCH"
          tar -xzf dist/rustc4-*.tar.gz --strip-components=1 -C "context/linux-$ARCH"
          docker build \
            --file tools/docker/Dockerfile \
            --platform "linux/$ARCH" \
            --provenance=false \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.version=$VERSION" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --tag "$IMAGE" \
            context

      - name: It runs
        run: |
          docker run --rm "$IMAGE"
          docker run --rm -v "$PWD/examples:/work:ro" "$IMAGE" check shop.c4
          # As whoever owns the directory written to, and with the image's
          # font: the PNG is the one thing that needs more than the binary.
          mkdir out
          docker run --rm --user "$(id -u):$(id -g)" \
            -v "$PWD/examples:/work:ro" -v "$PWD/out:/out" \
            "$IMAGE" export png shop.c4 -o /out
          ls -l out
          test -s out/index.png

      # From outside the container, through a published port: what the
      # image's RUSTC4_HOST is for.
      - name: It serves
        run: |
          docker run --detach --name serve -p 8080:8080 \
            -v "$PWD/examples:/work:ro" "$IMAGE" serve shop.c4
          if ! curl --fail --silent --show-error --retry 10 --retry-delay 1 --retry-all-errors \
              http://127.0.0.1:8080/model.json | grep -q shop.c4; then
            docker logs serve
            exit 1
          fi
          docker logs serve
          docker rm --force serve

      - name: Save
        env:
          ARCH: ${{ matrix.arch }}
        run: docker save "$IMAGE" | gzip > "image-linux-$ARCH.tar.gz"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-linux-${{ matrix.arch }}
          path: image-linux-${{ matrix.arch }}.tar.gz
          if-no-files-found: error
          retention-days: 7

  publish:
    name: attest and publish
    needs: [check, build, windows, image]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    # Only this job can sign or publish, and it runs none of the
    # repository's code: it takes the archives the builds made, and the
    # images made of them.
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          pattern: rustc4-*
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: |
          sha256sum rustc4-*.tar.gz rustc4-*.zip > SHA256SUMS
          cat SHA256SUMS

      # Signed build provenance for each archive: which repository, which
      # workflow, which commit. Verify a download with
      #   gh attestation verify rustc4-<version>-<target>.tar.gz --repo <owner>/rustc4
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/rustc4-*.tar.gz
            dist/rustc4-*.zip

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: images
          pattern: image-linux-*
          merge-multiple: true

      # Each architecture's image under a name of its own
      # (<version>-amd64, <version>-arm64), then one name over both, which
      # is the one to pull: Docker takes from it whichever the machine is.
      - name: Push the image
        id: image
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          name="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          for arch in amd64 arm64; do
            docker load --input "images/image-linux-$arch.tar.gz"
            docker tag "rustc4:$arch" "$name:$TAG-$arch"
            docker push "$name:$TAG-$arch"
          done
          # v1.2.3-rc.1 is a pre-release: `latest` stays where it was.
          names=(--tag "$name:$TAG")
          case "$TAG" in *-*) ;; *) names+=(--tag "$name:latest") ;; esac
          docker buildx imagetools create "${names[@]}" "$name:$TAG-amd64" "$name:$TAG-arm64"
          digest=$(docker buildx imagetools inspect "$name:$TAG" --format '{{json .Manifest}}' | jq -r .digest)
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "$name:$TAG@$digest"

      # The same for the image, kept beside it in the registry. Verify with
      #   gh attestation verify oci://ghcr.io/<owner>/rustc4:<version> --repo <owner>/rustc4
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # v1.2.3-rc.1 is a pre-release.
          flags=()
          case "$TAG" in *-*) flags+=(--prerelease) ;; esac
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "$TAG" \
            --generate-notes \
            "${flags[@]}"
